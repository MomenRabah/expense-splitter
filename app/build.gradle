plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.team.splitapp'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.team.splitapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.constraintlayout
}